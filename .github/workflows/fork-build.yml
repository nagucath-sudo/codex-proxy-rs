name: Fork Binary

on:
  push:
    branches:
      - repo/ci/fork-binary
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build release binary
        uses: ./.github/actions/build-binary
        with:
          rust: '1.99.1'
          target: x86_64-unknown-linux-gnu
          platform: linux-amd64

      - name: Test advertised WebSocket limits
        working-directory: backend
        run: cargo test --locked -p provider-openai --test main advertised_ -- --nocapture

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codex-proxy-rs-linux-amd64
          path: dist/binaries/linux-amd64/codex-proxy-rs
          if-no-files-found: error
          retention-days: 7
